 $('xl').onclick=async function(){
  var btn=$('xl'), old=btn.textContent;
  function msg(t){ btn.textContent=t; setTimeout(function(){btn.textContent=old},2500); }
  if(!current.length){ msg("Jadval bo'sh"); return; }
  if(!window.ExcelJS){ msg('Excel kutubxonasi yuklanmadi'); return; }
  try{
   var dl=null; try{ dl=(window.claude&&claude.use)?await claude.use('downloads'):null; }catch(e){}
   var cols=[['№',8],['Sana',12],['Mahsulot nomi',32],['Miqdori',10],['Birlik',10],['Narxi',13],['Summa',14],['Kimdan',24],['Kimga',22],['Kim olib keldi',22],['Jami',14],['Holat',12]];
   var wb=new ExcelJS.Workbook(), ws=wb.addWorksheet('Nakladnoylar',{views:[{state:'frozen',ySplit:1}]});
   ws.columns=cols.map(function(c){return {width:c[1]}});
   var th={style:'thin',color:{argb:'FF8A9690'}}, bd={top:th,left:th,bottom:th,right:th};
   var hr=ws.addRow(cols.map(function(c){return c[0]})); hr.height=22;
   hr.eachCell(function(c){ c.font={bold:true}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE4E9E6'}}; c.alignment={horizontal:'center',vertical:'middle'}; c.border=bd; });
   var grand=0, ctr=[1,2,4,5,12], num=[4,6,7,11];
   current.slice().sort(function(a,b){return a.no-b.no}).forEach(function(x){
    var start=ws.rowCount+1, t=total(x); grand+=t;
    var dd=null; if(x.d){ var p=x.d.split('-'); dd=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); }
    x.lines.forEach(function(l,i){
     ws.addRow([i?null:x.no,i?null:dd,l.n,l.q,uni(l.u||'дона'),l.p,l.q*l.p,i?null:x.from,i?null:x.to,i?null:x.by,i?null:t,i?null:(x.ok?'Yopilgan':'Ochiq')]);
    });
    var end=ws.rowCount;
    if(end>start) [1,2,8,9,10,11,12].forEach(function(c){ ws.mergeCells(start,c,end,c); });
    for(var r=start;r<=end;r++) for(var c=1;c<=12;c++){
     var cell=ws.getCell(r,c); cell.border=bd;
     cell.alignment={vertical:'middle',horizontal:ctr.indexOf(c)>-1?'center':(num.indexOf(c)>-1?'right':'left'),wrapText:true};
     if(num.indexOf(c)>-1) cell.numFmt='#,##0.##';
    }
    ws.getCell(start,2).numFmt='dd.mm.yyyy';
    ws.getCell(start,11).font={bold:true};
    var st=ws.getCell(start,12);
    st.fill={type:'pattern',pattern:'solid',fgColor:{argb:x.ok?'FF92D050':'FFFF0000'}};
    st.font={bold:true,color:{argb:x.ok?'FF000000':'FFFFFFFF'}};
    var sp=ws.addRow([]); sp.height=8;
    for(var k=1;k<=12;k++) sp.getCell(k).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFF00'}};
   });
   var tr=ws.addRow([]); tr.getCell(10).value='Umumiy jami:'; tr.getCell(11).value=grand;
   tr.getCell(10).font=tr.getCell(11).font={bold:true}; tr.getCell(11).numFmt='#,##0.##';
   var buf=await wb.xlsx.writeBuffer();
   var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
   var fn='nakladnoylar-'+iso(0)+'.xlsx';
   if(dl){ await dl.save({filename:fn,data:blob}); }
   else { var an=document.createElement('a'); an.href=URL.createObjectURL(blob); an.download=fn; document.body.appendChild(an); an.click(); setTimeout(function(){ an.remove(); URL.revokeObjectURL(an.href); },1500); }
   msg('Saqlandi');
  }catch(err){ msg(err&&err.code==='declined'?'Bekor qilindi':'Xatolik yuz berdi'); }
 };
